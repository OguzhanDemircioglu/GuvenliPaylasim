# Varsayılan ayarlar. Her biri -Dgps.<anahtar>=... ya da GPS_<ANAHTAR> ortam değişkeniyle ezilebilir
# (ör. -Dgps.server.url=https://paylasim.kurum.local, GPS_SERVER_URL=...).

# Uygulama sunucusu (kurum içi). Kurum ağı içinde olduğu için proxy kullanılmaz.
server.url=http://localhost:8080

# Güncellemelerin okunduğu GitHub deposu (sahip/ad). Boşsa güncelleme kontrolü yapılmaz.
update.repository=
# Yeni sürüm yayımlandıktan sonra kullanıcıya tanınan süre; bitince güncellemeden uygulama açılmaz.
update.grace-days=3
# Güncelleme kontrolü için GitHub API adresi (kurum içi aynaya yönlendirilebilir).
update.api-url=https://api.github.com

# Yeni belge kontrolü (saniye)
inbox.poll-seconds=15
