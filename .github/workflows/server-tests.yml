# Sunucu testleri; güvenlik kabul testleri (server/src/test/.../acceptance) gömülü PostgreSQL 18 ile çalışır.
name: Server tests

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Test
        working-directory: server
        run: sh mvnw -B -q test
