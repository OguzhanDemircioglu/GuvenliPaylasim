# Geliştirme ortamı. Değerler server/.env dosyasından ya da environment variable'dan gelir.
spring:
  config:
    # .env sadece dev profilinde okunur: testler ve prod gerçek DB bilgilerini yanlışlıkla kullanamaz.
    # Ortam değişkenleri her zaman .env'den önceliklidir. (.env git'e girmez.)
    import: optional:file:.env[.properties]
  datasource:
    # PostgreSQL bağlantısı (DB_URL, DB_USERNAME, DB_PASSWORD) application.yml'den gelir ve zorunludur;
    # dev'de .env'e yazılır. Şemanın dev'de varsayılanı vardır.
    hikari:
      schema: ${DB_SCHEMA:gps_v2}
  jpa:
    show-sql: true
    properties:
      hibernate.default_schema: ${DB_SCHEMA:gps_v2}

logging:
  pattern:
    # Her satıra isteğin traceId'si (TraceIdFilter → MDC) yazılır; istek dışındaki satırlarda boş kalır.
    correlation: "%correlationId{traceId(16)}"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  dev-login:
    # Yerelde login ekranını atlar (DevLoginController). DEV_LOGIN_ENABLED=false ile kapatılır.
    enabled: ${DEV_LOGIN_ENABLED:true}
  jwt:
    key-id: ${JWT_KEY_ID:dev-key}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
  session:
    cookie-secure: ${COOKIE_SECURE:false}
  security:
    # Sadece dev: herkesin bildiği sabit anahtar. Prod'da SERVER_SEAL_KEY ortam değişkeni zorunludur.
    seal-key: ${SERVER_SEAL_KEY:ZGV2LW9ubHktc2VhbC1rZXktMzItYnl0ZXMtbG9uZyE=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
